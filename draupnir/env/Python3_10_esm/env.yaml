name: draupnir_esm
channels:
  - conda-forge
  - pytorch
  - defaults
  - nvidia
  - bioconda
  - anaconda
dependencies:
  - pyopenssl
  - python=3.10
  - requests
  - pip:
    - -r requirements.txt
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu129
      - torch==2.8.0+cu129
  - torchvision
  - torchaudio
  - pytorch::ignite
  - numpy
  - biopython
  - h5py
  - scipy
  - scikit-learn
  - pandas
  - matplotlib
  - pyro-ppl
  - scanpy
  - dill
  - umap-learn
  - seaborn
  - dataframe_image
  - xmltodict
  - nbconvert
  - conda-forge::lightning
  - numba
  - conda-forge::jax[cuda12_pip]
  - conda-forge::jaxlib
  - ProDy
  - ete3
  - pyqt
  - tqdm
  - gdown
  - httpx





